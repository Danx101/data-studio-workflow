lead_categories:
  # Only GADs-native + generic default-goal names now (see notes: at top —
  # every GA4-linked duplicate event is excluded to avoid double-counting),
  # so these patterns are deliberately narrow rather than matching every
  # naming variant seen across accounts.
  - key: contact_phone
    label: "Telefonanrufe"
    group: contact
    match: { type: regex, pattern: '(?i)(Telefon Klick|Calls from ads|Call clicks from ads|Click-to-Call)' }
  - key: contact_mail
    label: "Mail-Kontakte"
    group: contact
    match: { type: regex, pattern: '(?i)(Mail Klick)' }
  - key: contact_form
    label: "Kontaktformulare"
    group: form
    # Anchored on the END so it doesn't also swallow "GADs - Vorsorgeformular".
    match: { type: regex, pattern: '(?i)(Kontaktformular$|Lead form - Submit|Lead-Formular.*senden)' }
  - key: contact_form_vorsorge
    label: "Vorsorgeformulare"
    group: form
    match: { type: regex, pattern: '(?i)(Vorsorgeformular$)' }
  - key: other
    label: "Sonstige"
    group: other
    match: { type: catch_all }

filters:
  - name: "Conversions Leads"
    mode: include
    field: "Segment Conversion Type Name"
    condition:
      type: regex
      pattern: '(?i)(Telefon Klick|Calls from ads|Call clicks from ads|Click-to-Call|Mail Klick|Kontaktformular$|Lead form - Submit|Lead-Formular.*senden|Vorsorgeformular$)'
    derived_from: "all lead_categories except 'other'"

  - name: "Anrufe"
    mode: include
    field: "Segment Conversion Type Name"
    condition: { type: regex, pattern: '(?i)(Telefon Klick|Calls from ads|Call clicks from ads|Click-to-Call)' }
    derived_from: "contact_phone"

  - name: "Formulare"
    mode: include
    field: "Segment Conversion Type Name"
    condition: { type: regex, pattern: '(?i)(Kontaktformular$|Lead form - Submit|Lead-Formular.*senden|Vorsorgeformular$)' }
    derived_from: "contact_form + contact_form_vorsorge (client asked for calls vs. forms; vorsorge folded into 'forms' at executive-summary level, kept distinguishable via the Anfrage-Kanal calculated field for a detail page later)"

  - name: "Kampagne: München"
    mode: include
    field: "Kampagne"
    condition: { type: contains, value: "München" }
    derived_from: "location: muenchen — PLACEHOLDER pattern, unverified"

  - name: "Kampagne: Hamburg"
    mode: include
    field: "Kampagne"
    condition: { type: contains, value: "Hamburg" }
    derived_from: "location: hamburg — PLACEHOLDER pattern, unverified"

calculated_fields:
  - name: "Anfrage-Kanal"
    type: case
    input_field: "Segment Conversion Type Name"
    cases:
      - when: { type: regex, pattern: '(?i)(Telefon Klick|Calls from ads|Call clicks from ads|Click-to-Call)' }
        then: "Telefon"
      - when: { type: regex, pattern: '(?i)(Mail Klick)' }
        then: "Mail"
      - when: { type: regex, pattern: '(?i)(Vorsorgeformular$)' }
        then: "Vorsorge-Formular"
      - when: { type: regex, pattern: '(?i)(Kontaktformular$|Lead form - Submit|Lead-Formular.*senden)' }
        then: "Kontaktformular"
    default: "Sonstige"

blends:
  - name: "Wien Summary"
    location: wien
    grain: []
    join_keys: []
    legs:
      - { alias: unfiltered, source: wien, filter: null, fields: ["Cost (converted)", "Klicks", "Impressionen"] }
      - { alias: leads, source: wien, filter: "Conversions Leads", fields: ["Leads Conv."] }
      - { alias: calls, source: wien, filter: "Anrufe", fields: ["Leads Conv."] }
      - { alias: forms, source: wien, filter: "Formulare", fields: ["Leads Conv."] }

  - name: "Graz Summary"
    location: graz
    grain: []
    join_keys: []
    legs:
      - { alias: unfiltered, source: graz, filter: null, fields: ["Cost (converted)", "Klicks", "Impressionen"] }
      - { alias: leads, source: graz, filter: "Conversions Leads", fields: ["Leads Conv."] }
      - { alias: calls, source: graz, filter: "Anrufe", fields: ["Leads Conv."] }
      - { alias: forms, source: graz, filter: "Formulare", fields: ["Leads Conv."] }

  - name: "München Summary"
    location: muenchen
    grain: []
    join_keys: []
    legs:
      - { alias: unfiltered, source: muenchen_de, filter: "Kampagne: München", fields: ["Cost (converted)", "Klicks", "Impressionen"] }
      - { alias: leads, source: muenchen_de, filter: ["Conversions Leads", "Kampagne: München"], fields: ["Leads Conv."] }
      - { alias: calls, source: muenchen_de, filter: ["Anrufe", "Kampagne: München"], fields: ["Leads Conv."] }
      - { alias: forms, source: muenchen_de, filter: ["Formulare", "Kampagne: München"], fields: ["Leads Conv."] }

  - name: "Hamburg Summary"
    location: hamburg
    grain: []
    join_keys: []
