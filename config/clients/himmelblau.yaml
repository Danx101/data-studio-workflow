# Himmelblau Executive Summary Dashboard
# Multi-account, multi-location client — unlike Peneder (one MCC), Himmelblau
# has one Google Ads account per location (mostly). Brief: "pro Standort die
# Daten einzeln, möglichst aber auf einer Seite vereint" — one repeated KPI
# block per location on a single page, not a cross-location blended table.
# Client explicitly wants phone calls and filled contact forms shown as
# their own numbers, separate from the account totals, because softconversions
# (engagement signals like scroll depth / time-on-page / PDF downloads) are
# now also tracked and would otherwise inflate "Alle Conv.".

client: himmelblau
report_template: gads-leadgen-v1
notes: >
  Built 2026-09-22 from pasted Google Ads Conversions tables for 5 accounts,
  then corrected 2026-09-22 against "Himmelblau Conversions.xlsx" — the
  client's own hand-curated list of relevant lead conversions per account.
  That correction mattered: the first pass had counted both a GADs-native
  conversion action AND its parallel GA4-linked duplicate as separate real
  leads for the same underlying event (e.g. "GADs - Kontaktformular" and
  "... GA4 (web) contact_form" both firing on one form submit), which would
  have double-counted every lead. conversion_actions.include_in_conversions
  now follows the xlsx exactly: only GADs-native conversions plus the
  account's generic default goals ("Lead form - Submit"/"Lead-Formular –
  senden", "Calls from ads"/"Call clicks from ads") count; every GA4-linked
  duplicate is excluded.
  account_id values below are now the confirmed customer IDs from the xlsx
  header row (Wien's differs by one leading digit from the sheet — used the
  browser-confirmed "995-267-0917" instead of the sheet's "95-267-0917").
  OPEN ITEMS before this goes live:
  - München's account is explicitly labeled "Bestattung Himmelblau München"
    in the xlsx (not generic "DE" as GA4 events suggested), and the xlsx
    lists only 5 accounts total — no dedicated Hamburg account. Whether
    Hamburg campaigns actually live inside this München account (vs. being
    untracked like St. Pölten/Klosterneuburg) is still unconfirmed — the
    `campaign_filter` values for muenchen/hamburg below remain PLACEHOLDERS.
  - St. Pölten & Klosterneuburg (Niederösterreich) have no dedicated
    account and their GA4 form-fire triggers don't fire at all currently.
    Per client decision, both are listed as `pending` placeholder blocks
    ("Tracking wird eingerichtet") rather than folded into another
    location or omitted silently.

locations:
  - key: wien
    label: "Wien"
    status: tracked
    data_source: wien
  - key: graz
    label: "Graz"
    status: tracked
    data_source: graz
  - key: muenchen
    label: "München"
    status: tracked
    data_source: muenchen_de
    campaign_filter: { type: contains, value: "München" }   # PLACEHOLDER — verify real campaign names
    notes: "muenchen_de account's GA4 tag is 'DE', not city-specific — campaign_filter is a guess."
  - key: hamburg
    label: "Hamburg"
    status: tracked
    data_source: muenchen_de
    campaign_filter: { type: contains, value: "Hamburg" }   # PLACEHOLDER — verify real campaign names
    notes: "Assumed to share the muenchen_de account via campaign split — unconfirmed."
  - key: unvergessen
    label: "Bestattung Unvergessen"
    status: tracked
    data_source: unvergessen
  - key: furtner
    label: "Bestattung Furtner"
    status: tracked
    data_source: furtner
  - key: st_poelten
    label: "St. Pölten"
    status: pending
    notes: "No dedicated account; GA4 form-fire tracking not configured yet. Render as placeholder tile."
  - key: klosterneuburg
    label: "Klosterneuburg"
    status: pending
    notes: "No dedicated account; GA4 form-fire tracking not configured yet. Render as placeholder tile."

data_sources:
  wien:
    type: google_ads
    account_id: "995-267-0917"   # xlsx showed "95-267-0917"; browser-confirmed as 995-267-0917
    label: "Bestattung Himmelblau"
  furtner:
    type: google_ads
    account_id: "338-081-1411"
    label: "Bestattung Furtner"
  muenchen_de:
    type: google_ads
    account_id: "730-477-8201"
    label: "Bestattung Himmelblau München"
  unvergessen:
